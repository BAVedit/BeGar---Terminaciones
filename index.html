<style>
/* Pantalla de inicio con el logo BAV: va acá para que se vea antes de que carguen fuentes y estilos */
.inicio { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--pagina, #fff); transition: opacity .55s ease .1s, visibility 0s linear .65s; }
.inicio-logo { width: min(62vw, 340px); height: auto; overflow: visible; opacity: 0; }
.inicio-logo path { fill: var(--tinta, #1a1a1a); fill-opacity: 0; stroke: var(--tinta, #1a1a1a); stroke-width: 5; stroke-dasharray: var(--largo, 12000); stroke-dashoffset: var(--largo, 12000); }
.inicio.anima .inicio-logo { opacity: 1; animation: inicio-entra 1.5s cubic-bezier(.2, .7, .2, 1) both; }
.inicio.anima .inicio-logo path { animation: inicio-trazo 1.2s cubic-bezier(.65, 0, .35, 1) .1s forwards, inicio-relleno .45s ease 1.05s forwards; }
.inicio.sale { opacity: 0; visibility: hidden; }
.inicio.sale .inicio-logo { animation: none; transform: scale(1.08); opacity: 0; filter: blur(2px); transition: transform .55s cubic-bezier(.5, 0, .75, 0), opacity .45s ease, filter .45s ease; }
@keyframes inicio-trazo { to { stroke-dashoffset: 0; } }
@keyframes inicio-relleno { to { fill-opacity: 1; stroke-width: 0; } }
@keyframes inicio-entra { from { opacity: 0; transform: scale(.94); } 20% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
/* con "reducir movimiento" activado en el teléfono: sin trazo, el logo aparece y se va con un fundido */
@media (prefers-reduced-motion: reduce) {
  .inicio-logo path { stroke-width: 0; fill-opacity: 1; }
  .inicio.anima .inicio-logo { animation: inicio-fundido .6s ease both; }
  .inicio.anima .inicio-logo path { animation: none; }
  .inicio.sale .inicio-logo { transform: none; filter: none; }
}
@keyframes inicio-fundido { from { opacity: 0; } to { opacity: 1; } }
</style>

<script>
// Pantalla de inicio con el logo: entra, se queda un momento y sale. Un toque la saltea.
(() => {
  const el = document.getElementById('inicio');
  const trazo = el.querySelector('path');
  try { el.style.setProperty('--largo', Math.ceil(trazo.getTotalLength()) + 1); } catch (e) { /* queda el valor por defecto */ }
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const salir = () => { if (el.classList.contains('sale')) return; el.classList.add('sale'); setTimeout(() => el.remove(), 700); };
  // la animación y el reloj arrancan recién cuando la pantalla se dibuja (en celulares lentos puede tardar)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('anima');
    setTimeout(salir, quieto ? 1400 : 2400);
  }));
  el.addEventListener('pointerdown', salir);
})();
</script>
