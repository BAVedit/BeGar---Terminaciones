<div id="app">
  <header class="barra" id="barra">
    <button class="btn-icono" id="volver" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <h1 id="barra-h1">Proyectos activos</h1>

    <button class="btn-icono" id="btn-ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

  <main id="vista"></main>

  <div class="hoja-asa"></div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</section>
