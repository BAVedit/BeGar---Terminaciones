# Compila la app Android (android-app/) y la deja en Releases → apk.
# Para que la app avise a los teléfonos: copiar el APK a visor/descargas/BAV-BeGar.apk,
# poner el número de esta corrida en visor/descargas/version.json y publicar visor en gh-pages.
name: APK Android
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias
        working-directory: android-app
        run: npm ci && npx cap sync android
      - name: Compilar
        working-directory: android-app/android
        run: |
          # siempre la misma firma, así cada APK nuevo se instala encima del anterior
          mkdir -p ~/.android && cp ../firma/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Terminaciones-BeGar.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Terminaciones-BeGar-apk
          path: Terminaciones-BeGar.apk
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Terminaciones-BeGar.apk --target "$GITHUB_SHA" --title "App Android (versión ${GITHUB_RUN_NUMBER})" \
            --notes "Descargá Terminaciones-BeGar.apk desde el celular y abrilo para instalar. La app abre la versión publicada, así que los cambios llegan solos."
